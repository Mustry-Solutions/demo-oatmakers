# PR validation: two jobs on every pull request into main.
#
#   Lint           iglint on every project and on the gateway resources in
#                  services/, with the rules in iglint.toml. iglint parses
#                  every file, so broken JSON fails here too.
#   Deploy safety  what would break or endanger a production deploy: every
#                  release.yaml pin is an existing tag on main, the gateway
#                  identity stays out of the payload, the module manifest
#                  matches third-party-modules/, migrations come in up/down
#                  pairs and jar-files/jar/ holds only JARs. Every step runs
#                  even when an earlier one fails, so one run shows them all.
#
# Both run in well under a minute. Job ids double as status-check names: keep
# them stable if a ruleset requires them.

name: CI

on:
  pull_request:
    branches: [main]

# Cancel any in-flight CI run for this PR when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: iglint (projects)
        run: |
          set -euo pipefail
          pip install iglint==0.1.0
          iglint check --output-format github projects/*/


      - name: iglint (gateway resources)
        if: always()
        # Tags, UDTs, tag groups and the other gateway resources, checked
        # against the projects that use them.
        run: |
          set -euo pipefail
          [ -d services ] || { echo "No services/, skipping."; exit 0; }
          pip install iglint==0.1.0
          iglint check --output-format github services

  deploy-safety:
    name: Deploy safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Pins are checked against the tags and main, so fetch them.
          fetch-depth: 0
          fetch-tags: true

      - name: Schema + every pin points at an existing tag on main
        if: always()
        run: |
          set -euo pipefail
          pip install pyyaml==6.0.2
          python3 - <<'EOF'
          import re, subprocess, sys, yaml

          ERRORS = []
          def err(msg): ERRORS.append(msg)

          try:
              with open("release.yaml") as f:
                  data = yaml.safe_load(f)
          except FileNotFoundError:
              print("::error::release.yaml is gone — this file is the production state, it must exist at the repo root")
              sys.exit(1)
          except yaml.YAMLError as e:
              print(f"::error file=release.yaml::Not valid YAML: {e}")
              sys.exit(1)

          if not isinstance(data, dict):
              print("::error file=release.yaml::Expected a mapping with 'gateway' and 'projects'")
              sys.exit(1)

          if data.get("gateway") != "oatmakers-site-7":
              err(f"gateway must be 'oatmakers-site-7', got {data.get('gateway')!r}")

          unknown = set(data) - {"gateway", "projects"}
          if unknown:
              err(f"unknown top-level keys: {sorted(unknown)}")

          projects = data.get("projects")
          if not isinstance(projects, dict) or not projects:
              err("'projects' must be a non-empty mapping of <project>: vX.Y.Z")
              projects = {}

          tags = set(subprocess.run(
              ["git", "tag", "--list"],
              capture_output=True, text=True, check=True).stdout.split())

          for name, version in projects.items():
              if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_-]*", str(name)):
                  err(f"project name {name!r} is not a valid name")
                  continue
              if not re.fullmatch(r"v\d+\.\d+\.\d+", str(version)):
                  err(f"{name}: version {version!r} must look like v1.2.3")
                  continue
              tag = f"{name}@{version}"
              if tag not in tags:
                  # Tag races are part of the lab: tell the student what IS
                  # released for this project and which number is free next.
                  taken = sorted(
                      tuple(map(int, m.groups()))
                      for t in tags
                      if (m := re.fullmatch(rf"{re.escape(str(name))}@v(\d+)\.(\d+)\.(\d+)", t)))
                  if taken:
                      latest = taken[-1]
                      hint = (f"existing releases: {', '.join('v%d.%d.%d' % v for v in taken)} — "
                              f"next free is v{latest[0]}.{latest[1]}.{latest[2] + 1}")
                  else:
                      hint = "no releases exist for this project yet — start at v1.0.0"
                  err(f"{name}: pinned at {version} but tag '{tag}' does not exist — "
                      f"push the tag first, the release must exist before release.yaml may point at it ({hint})")
                  continue
              # A tag on a commit that never merged would ship unreviewed
              # code through a one-line release PR.
              on_main = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", f"refs/tags/{tag}^{{commit}}",
                   "refs/remotes/origin/main"]).returncode == 0
              if not on_main:
                  err(f"{name}: tag '{tag}' points at a commit that is not on main. "
                      "A release must be a reviewed, merged commit: merge your change first, "
                      "then tag main and pin that tag")
                  continue
              tree = subprocess.run(
                  ["git", "ls-tree", "-d", f"refs/tags/{tag}", "--", f"projects/{name}"],
                  capture_output=True, text=True, check=True).stdout.strip()
              if not tree:
                  err(f"{name}: tag '{tag}' exists but contains no projects/{name}/ — "
                      "tag a commit that actually has the project on main")

          if "oatmakers" not in projects:
              err("the 'oatmakers' pin is required — the shared project's tag also carries "
                  "the gateway config, modules, JARs and migrations")

          for e in ERRORS:
              print(f"::error file=release.yaml::{e}")
          if ERRORS:
              sys.exit(1)
          print(f"release.yaml OK: {len(projects)} pin(s), every tag exists and is on main.")
          EOF

      - name: Module manifest ↔ third-party-modules/ agree
        if: always()
        # Every manifest entry under /third-party-modules/ must ship its .modl
        # in this repo and record the trust pair (certFingerprint +
        # licenseAgreementHash) — the lab 06 move. And every .modl in the
        # folder must be registered, or the gateway would never load it.
        run: |
          set -euo pipefail
          [ -f services/modules.json ] || { echo "No services/modules.json — skipping."; exit 0; }
          python3 - <<'EOF'
          import json, os, sys

          with open("services/modules.json") as f:
              manifest = json.load(f)

          errors = []
          referenced = set()
          for module_id, entry in manifest.items():
              filename = entry.get("filename", "")
              if not filename.startswith("/third-party-modules/"):
                  continue  # gateway-bundled module, nothing to ship
              basename = os.path.basename(filename)
              referenced.add(basename)
              if not os.path.isfile(f"third-party-modules/{basename}"):
                  errors.append(f"{module_id}: manifest points at {filename} but "
                                f"third-party-modules/{basename} is not in the repo")
              if entry.get("onStartup") == "enabled":
                  for key in ("certFingerprint", "licenseAgreementHash"):
                      if key not in entry:
                          errors.append(f"{module_id}: enabled third-party module is missing "
                                        f"'{key}' — the gateway will refuse to trust it")

          if os.path.isdir("third-party-modules"):
              for f in os.listdir("third-party-modules"):
                  if f.endswith(".modl") and f not in referenced:
                      errors.append(f"third-party-modules/{f} is not registered in "
                                    "services/modules.json — it would never be installed")

          for e in errors:
              print(f"::error file=services/modules.json::{e}")
          sys.exit(1 if errors else 0)
          EOF
          echo "Module manifest and third-party-modules/ agree."

      - name: Gateway identity resources stay clean
        if: always()
        # Same model as the earlier labs: the repo carries the LOCAL
        # gateway's identity (systemName oatmakers-local), and the deploy
        # never ships system-properties: production keeps its own name.
        # security-properties DOES deploy (permission policy, including
        # the APIKEY security level the deploy's scan API needs), so
        # first-boot commissioning churn (temp auth profile) must never
        # merge. Run scripts/setup.sh after a fresh clone's
        # first `docker compose up` and this stays green by itself.
        run: |
          set -euo pipefail
          sp="services/config/resources/core/ignition/security-properties/config.json"
          syp="services/config/resources/core/ignition/system-properties/config.json"
          if [ ! -f "$sp" ] || [ ! -f "$syp" ]; then
            echo "identity resources absent — skipping"
            exit 0
          fi
          fail=0
          if ! grep -q '"APIKEY"' "$sp"; then
            echo "::error file=$sp::The APIKEY security level is gone — this is first-boot commissioning churn, run scripts/setup.sh (or git checkout the file)"
            fail=1
          fi
          if ! grep -q '"systemAuthProfile": "default"' "$sp"; then
            echo "::error file=$sp::systemAuthProfile is not default — first-boot commissioning churn, run scripts/setup.sh (or git checkout the file)"
            fail=1
          fi
          if ! grep -q '"systemName": "oatmakers-local"' "$syp"; then
            echo "::error file=$syp::systemName is not oatmakers-local. The repo carries the LOCAL gateway's identity; don't commit another gateway's rewrite"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "Gateway identity resources are clean."
          exit "$fail"

      - name: Migration pairs (.up.sql ↔ .down.sql)
        if: always()
        # Always pairs: every up has a down, every down has an up.
        run: |
          set -euo pipefail
          dir="db-migration/migrate"
          [ -d "$dir" ] || { echo "No $dir — skipping."; exit 0; }
          fail=0
          shopt -s nullglob
          for up in "$dir"/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            if [ ! -f "$down" ]; then
              echo "::error file=$up::Missing its .down.sql pair"
              fail=1
            fi
          done
          for down in "$dir"/*.down.sql; do
            up="${down%.down.sql}.up.sql"
            if [ ! -f "$up" ]; then
              echo "::error file=$down::Missing its .up.sql pair"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All migrations come in pairs."
          exit "$fail"

      - name: jar-files/jar/ hygiene
        if: always()
        # Library JARs only (→ the gateway's JAR directory at deploy time), plus a README
        # recording where each JAR came from.
        run: |
          set -euo pipefail
          [ -d jar-files/jar ] || { echo "No jar-files/jar/ — skipping."; exit 0; }
          fail=0
          while IFS= read -r f; do
            case "$f" in
              *.jar|*/README.md|*/.gitkeep) ;;
              *) echo "::error file=$f::Only *.jar (and a README) belong in jar-files/jar/"; fail=1 ;;
            esac
          done < <(find jar-files/jar -type f)
          [ "$fail" -eq 0 ] && echo "jar-files/jar/ holds only JARs."
          exit "$fail"
